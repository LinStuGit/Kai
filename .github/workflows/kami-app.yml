name: Kami App

on:
  push:
    branches:
      - main
    paths:
      - 'kamiApp/**'
      - 'androidApp/**'
      - 'composeApp/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/kami-app.yml'
  workflow_dispatch:

jobs:
  apk:
    name: Build Kami APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Accept Android SDK licenses
        # Don't install via the runner's sdkmanager: the image's cmdline-tools
        # is too old to see platforms;android-37, and setup-android@v3 is
        # broken (Google removed the legacy 'tools' package). AGP ships its
        # own updater and auto-downloads whatever platforms/build-tools the
        # build needs — it only requires the licenses to be accepted.
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55"  > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d975f7516f57d659f0688f2961537faf0133c0bb"  > "$ANDROID_HOME/licenses/android-preview-license"
      - name: Unit tests (kamiApp)
        run: bash ./gradlew :kamiApp:testDebugUnitTest --stacktrace
      - name: Build APKs (mini console + full Kai)
        run: bash ./gradlew :kamiApp:assembleDebug :androidApp:assembleFossDebug --stacktrace
      - name: Upload kamiApp APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kami-debug-apk
          path: kamiApp/build/outputs/apk/debug/kamiApp-debug.apk
      - name: Upload Kai APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kai-foss-debug-apk
          path: androidApp/build/outputs/apk/foss/debug/androidApp-foss-debug.apk
