name: Kami App

on:
  push:
    branches:
      - main
    paths:
      - 'kamiApp/**'
      - 'androidApp/**'
      - 'composeApp/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/kami-app.yml'
  workflow_dispatch:

jobs:
  apk:
    name: Build Kami APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Setup Android SDK
        # android-actions/setup-android@v3 is broken (legacy 'tools' package
        # removed from Google's repo) — use the runner's preinstalled SDK.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0" > /dev/null
      - name: Build APKs (mini console + full Kai)
        run: bash ./gradlew :kamiApp:assembleDebug :androidApp:assembleFossDebug --stacktrace
      - name: Upload kamiApp APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kami-debug-apk
          path: kamiApp/build/outputs/apk/debug/kamiApp-debug.apk
      - name: Upload Kai APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kai-foss-debug-apk
          path: androidApp/build/outputs/apk/foss/debug/androidApp-foss-debug.apk
